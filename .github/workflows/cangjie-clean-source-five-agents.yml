name: M16.13 REAL pinned Cangjie five semantic extractors on clean V5 source excerpts

on:
  pull_request:
    paths:
      - ".github/workflows/cangjie-clean-source-five-agents.yml"
      - "scripts/cangjie_clean_source_agents.py"
      - "tests/test_cangjie_clean_source_agents.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-short-source-and-official-role-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify 13 existing original-source short quotes and zero unreviewed live promotions
        run: |
          python -m unittest discover -s tests -p "test_cangjie_clean_source_agents.py" -v
          python -m unittest discover -s tests -p "test_cangjie_source_short_review.py" -v

  ACTUAL-Cangjie-Adler-and-five-independent-LLM-roles:
    needs: clean-short-source-and-official-role-contract
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OMP_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pdfinfo and pinned upstream Cangjie CLI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet PyYAML

      - name: Download BOTH actual 1925 scan PDFs into PRIVATE runner storage and verify SHA256
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/originals"
          curl --fail --location --retry 3 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/a/a0/NLC416-12jh002690-44091_%E9%BA%BB%E8%A1%A3%E7%9B%B8%E6%B3%95_%E7%AC%AC1%E5%8D%B7.pdf" \
            -o "$RUNNER_TEMP/originals/part1.pdf"
          curl --fail --location --retry 3 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/5/5d/NLC416-12jh002690-44092_%E9%BA%BB%E8%A1%A3%E7%9B%B8%E6%B3%95_%E7%AC%AC2%E5%8D%B7.pdf" \
            -o "$RUNNER_TEMP/originals/part2.pdf"
          echo "466adfaba96be3ba63cab4784b97dd04d1a7e86950601073e27aa6bdffbcc649  $RUNNER_TEMP/originals/part1.pdf" | sha256sum -c -
          echo "ce9020bb7d2e404f16689519c0c33df3525e3131b980b02344ed9ed967303ef7  $RUNNER_TEMP/originals/part2.pdf" | sha256sum -c -

      - name: REAL pinned upstream kangarooking/cangjie-skill checkout; run doctor
        shell: bash
        run: |
          git clone --quiet https://github.com/kangarooking/cangjie-skill.git "$RUNNER_TEMP/cangjie"
          git -C "$RUNNER_TEMP/cangjie" checkout --quiet a28de55ba881b9928956a55048f743f7a9e3b23e
          test "$(git -C "$RUNNER_TEMP/cangjie" rev-parse HEAD)" = "a28de55ba881b9928956a55048f743f7a9e3b23e"
          python "$RUNNER_TEMP/cangjie/scripts/cangjie.py" doctor

      - name: Install and start ACTUAL local Qwen3 4B instruct LLM
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://ollama.com/install.sh -o "$RUNNER_TEMP/install-ollama.sh"
          sh "$RUNNER_TEMP/install-ollama.sh"
          if ! curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen3:4b-instruct
          python - <<'PY'
          import json
          from urllib.request import urlopen
          models=json.load(urlopen("http://127.0.0.1:11434/api/tags"))["models"]
          match=[m for m in models if m["name"]=="qwen3:4b-instruct"]
          assert len(match)==1
          print("ACTUAL local model and digest:",match[0]["name"],match[0]["digest"])
          PY

      - name: ACTUALLY RUN Stage0 Adler sample + five independent OFFICIAL pinned role prompts on clean historical short source
        shell: bash
        run: |
          python -m scripts.cangjie_clean_source_agents \
            --scan-dir "$RUNNER_TEMP/originals" \
            --catalog src/knowledge/maiyi-source-checked-v5.json \
            --upstream "$RUNNER_TEMP/cangjie" \
            --private-dir "$RUNNER_TEMP/private-five-agent-clean-research" \
            --out-metadata m16-13-official-clean-V5-13-quote-model-metadata-only.json \
            --model qwen3:4b-instruct

      - name: Quality gate actual 13 original-source references and real five independent role responses
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open("m16-13-official-clean-V5-13-quote-model-metadata-only.json",encoding="utf-8"))
          assert r["preexisting_AI_scan_visual_legacy_excerpt_count"]==13
          assert r["actual_independently_human_signed_new_short_ROIs"]==0
          assert r["official_upstream"]["pinned_original_cangjie_commit"]=="a28de55ba881b9928956a55048f743f7a9e3b23e"
          assert len(r["official_upstream"]["official_upstream_files_sha256"])==7
          assert r["real_Adler_sample_model_completed"] is True
          assert r["independent_real_extractor_roles_attempted"]==5
          assert r["independent_real_extractor_role_calls_completed"]==5
          assert r["total_LLM_candidate_concepts_source_quote_id_bound"]>=1
          assert len(r["source_ids_for_matched_candidate_concepts"])>=1
          assert r["model_fabricated_original_quotes_accepted"]==0
          assert r["new_live_Faceface_rules"]==0
          assert r["new_source_original_full_pages_human_signed"]==0
          assert r["never_claimed_whole_book_agents_complete"] is True
          assert r["public_report_contains_any_ancient_short_quote_or_LLM_analysis"] is False
          print("ACTUAL PINNED OFFICIAL CANGJIE FIVE EXTRACTORS ON CLEAN HISTORICAL SHORT SOURCE: PASSED")
          print("ACTUAL MODEL:",r["model"])
          print("VALID SOURCE-ID-BOUND CANDIDATE CONCEPTS:",r["total_LLM_candidate_concepts_source_quote_id_bound"])
          print("COUNT BY OFFICIAL ROLE:",r["source_id_matched_candidate_count_per_role"])
          print("NO newly human-reviewed original text; NO source-unverified rule published.")
          PY

      - name: Upload aggregate source IDs and role counts ONLY, not LLM interpretations or original ancient excerpts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-13-real-pinned-cangjie-clean-historical-13-source-excerpts-aggregate
          path: m16-13-official-clean-V5-13-quote-model-metadata-only.json
          retention-days: 21
          if-no-files-found: warn
