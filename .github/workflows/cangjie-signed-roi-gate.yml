name: M16.13 signed ROI gate tests

on:
  pull_request:
    paths:
      - "scripts/cangjie_signed_roi_input.py"
      - "tests/test_cangjie_signed_roi_input.py"
      - ".github/workflows/cangjie-signed-roi-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-roi-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run source-gate unit tests (synthetic crop files only)
        run: python -m unittest tests.test_cangjie_signed_roi_input tests.test_cangjie_source_short_review
