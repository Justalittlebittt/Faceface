name: M16.12 real 1925 source column crop OCR and physical layout diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/cangjie-original-column-roi.yml"
      - "scripts/cangjie_original_column_roi.py"
      - "tests/test_cangjie_original_column_roi.py"
      - "research/M16_12_SOURCE_COLUMN_LOCATORS.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-region-provenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image library only for synthetic geometry tests
        run: python -m pip install --quiet Pillow
      - name: Verify actual source phrase IDs, original physical columns, and forbid unreviewed rule promotion
        run: |
          python -m unittest discover -s tests -p "test_cangjie_original_column_roi.py" -v
          python -m unittest discover -s tests -p "test_cangjie_original_phrase_probe.py" -v

  real-original-two-page-column-ocr:
    needs: original-region-provenance-contract
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      DISABLE_MODEL_SOURCE_CHECK: "True"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install REAL PaddleOCR 3.3.2/CPU3.2.0 and Poppler source renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet --no-cache-dir paddlepaddle==3.2.0
          python -m pip install --quiet --no-cache-dir paddleocr==3.3.2

      - name: Download BOTH exact original 1925 PDF files privately
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/originals"
          curl --fail --location --retry 3 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/a/a0/NLC416-12jh002690-44091_%E9%BA%BB%E8%A1%A3%E7%9B%B8%E6%B3%95_%E7%AC%AC1%E5%8D%B7.pdf" \
            -o "$RUNNER_TEMP/originals/part1.pdf"
          curl --fail --location --retry 3 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/5/5d/NLC416-12jh002690-44092_%E9%BA%BB%E8%A1%A3%E7%9B%B8%E6%B3%95_%E7%AC%AC2%E5%8D%B7.pdf" \
            -o "$RUNNER_TEMP/originals/part2.pdf"

      - name: ACTUALLY crop source image columns, rotate vertical text and recognize 4 physical regions
        run: |
          python -m scripts.cangjie_original_column_roi \
            --scan-dir "$RUNNER_TEMP/originals" \
            --private-root "$RUNNER_TEMP/m16-12-private-original-crops" \
            --source-region-locators research/M16_12_SOURCE_COLUMN_LOCATORS.json \
            --source-phrases research/M16_10_ORIGINAL_IMAGE_PHRASE_PILOT.json \
            --out m16-12-original-column-ocr-source-metadata-only.json

      - name: Assert real original source pages/independent column recognition, no fake proofread
        run: |
          python - <<'PY'
          import json
          with open("m16-12-original-column-ocr-source-metadata-only.json",encoding="utf-8") as f:
              report=json.load(f)
          assert report["original_scan_page_count"]==2
          assert report["real_original_image_column_crops_OCR_inferred"]==4
          assert report["short_AI_visually_read_ancient_references_tested"]==3
          assert report["human_verified_original_short_quotes"]==0
          assert report["full_original_page_human_transcriptions_added"]==0
          assert report["official_Cangjie_semantic_extractor_calls_from_this_run"]==0
          assert report["new_live_Faceface_historical_rules"]==0
          assert report["public_artifact_contains_original_OCR_text_or_crop_image"] is False
          by_id={x["target_id"]:x for x in report["per_original_page_source_region_retrieval"]}
          assert by_id["M1612-T01"]["source_column_count"]==2
          assert by_id["M1612-T02"]["source_column_count"]==1
          assert by_id["M1612-T03"]["source_column_count"]==1
          print("REAL original p086/p027 crop OCR inference: PASS")
          print("single-line match:",report["exact_match_in_any_single_crop_OCR_line"],"/3")
          print("physical two-column layout-only matches:",
                report["retrieval_only_by_joining_explicit_source_adjacent_columns"])
          print("targeted references still missing:",report["unmatched_priority_source_crop_targets"])
          print("Original ancient full-page reviews and website rules both remain ZERO.")
          PY

      - name: Upload source/page/crop hash metadata only; original scan crop & OCR text stay private
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-12-original-1925-source-column-crop-evidence-only
          path: m16-12-original-column-ocr-source-metadata-only.json
          retention-days: 14
          if-no-files-found: warn
