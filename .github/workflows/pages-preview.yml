name: Publish Faceface HTTPS test site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-preview.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "faceface-pages-preview"
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify and build for GitHub Pages subpath
        run: |
          npm test
          npx tsc --noEmit
          npx vite build --base="./"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy test site
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published HTTPS pages
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          case "$SITE_URL" in https://*) ;; *) echo "Deployment did not return an HTTPS URL"; exit 1 ;; esac
          BASE="${SITE_URL%/}/"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 3 --max-time 20 "${BASE}" -o /tmp/faceface-index.html
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 3 --max-time 20 "${BASE}privacy.html" -o /tmp/faceface-privacy.html
          grep -q 'id="root"' /tmp/faceface-index.html
          grep -q 'assets/index-' /tmp/faceface-index.html
          grep -q 'Privacy notice' /tmp/faceface-privacy.html
          echo "PASS: deployed Faceface homepage and privacy page return valid HTTPS HTML"
