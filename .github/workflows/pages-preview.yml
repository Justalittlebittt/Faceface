name: Publish Faceface HTTPS test site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-preview.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "faceface-pages-preview"
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify and build for GitHub Pages subpath
        run: |
          npm test
          npx tsc --noEmit
          npx vite build --base="./"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy test site
        id: deploy
        uses: actions/deploy-pages@v4
