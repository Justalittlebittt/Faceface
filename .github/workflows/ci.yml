name: Web checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and bundle
        run: npm run build
      - name: Geometry unit tests (not real camera acceptance)
        run: npm test
      - name: Preserve production bundle and dependency lock for inspection
        uses: actions/upload-artifact@v4
        with:
          name: faceface-m1-build
          path: |
            dist/
            package-lock.json
          if-no-files-found: error
          retention-days: 7
