name: M16.7 REAL 1925 scan Qwen3-VL CPU inference (no uploaded book text)

on:
  pull_request:
    paths:
      - ".github/workflows/cangjie-real-vlm-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-local-vision-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poppler source PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download BOTH original 1925 scans to EPHEMERAL private job storage
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/faceface-originals"
          curl --fail --location --retry 3 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/a/a0/NLC416-12jh002690-44091_%E9%BA%BB%E8%A1%A3%E7%9B%B8%E6%B3%95_%E7%AC%AC1%E5%8D%B7.pdf" \
            -o "$RUNNER_TEMP/faceface-originals/part1.pdf"
          curl --fail --location --retry 3 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/5/5d/NLC416-12jh002690-44092_%E9%BA%BB%E8%A1%A3%E7%9B%B8%E6%B3%95_%E7%AC%AC2%E5%8D%B7.pdf" \
            -o "$RUNNER_TEMP/faceface-originals/part2.pdf"
          pdfinfo "$RUNNER_TEMP/faceface-originals/part1.pdf" | grep '^Pages:'
          pdfinfo "$RUNNER_TEMP/faceface-originals/part2.pdf" | grep '^Pages:'

      - name: Install and START actual Ollama CPU inference service
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh \
            -o "$RUNNER_TEMP/ollama-install.sh"
          sh "$RUNNER_TEMP/ollama-install.sh"
          ollama --version
          if ! curl --silent --fail "http://127.0.0.1:11434/api/tags" >/dev/null; then
            nohup ollama serve > "$RUNNER_TEMP/ollama-serve.log" 2>&1 &
          fi
          for i in $(seq 1 50); do
            if curl --silent --fail "http://127.0.0.1:11434/api/tags" >/dev/null; then
              echo "Real Ollama API ready"
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error "http://127.0.0.1:11434/api/tags" >/dev/null

      - name: Pull REAL Qwen3-VL 2B instruct vision checkpoint (not a mock)
        shell: bash
        run: |
          ollama pull qwen3-vl:2b-instruct
          ollama list
          curl --fail --silent --show-error "http://127.0.0.1:11434/api/tags" \
            -o "$RUNNER_TEMP/ollama-model-tags.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          t=json.loads((Path(os.environ["RUNNER_TEMP"])/"ollama-model-tags.json").read_text())
          matched=[m for m in t["models"] if m["name"]=="qwen3-vl:2b-instruct"]
          assert len(matched)==1, "Actual local checkpoint missing"
          print("Verified actual model image/text checkpoint:",matched[0]["name"])
          print("Model digest:",matched[0]["digest"])
          PY

      - name: REAL ORIGINAL-IMAGE inference on three book sections plus second scan
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from scripts.cangjie_review_core import ReviewWorkspace
          from scripts.cangjie_vision_agent_batch import (
              OllamaLoopback, draft_paths, draft_valid, run_batch
          )
          from scripts.cangjie_ocr_benchmark import anchor_probe,reference_anchors
          temp=Path(os.environ["RUNNER_TEMP"])
          corpus=temp/"faceface-originals"
          drafts=temp/"real-qwen3-drafts"
          model="qwen3-vl:2b-instruct"
          w=ReviewWorkspace(corpus,temp/"private-ocr",temp/"private-reviewed",
                            draft_dir=drafts)
          # Historical source pages 27, 35, 87 have vetted short excerpts.
          # Second scanned fascicle page 40 has no vetted excerpt and is
          # evaluated by transcription presence/provenance only.
          original_pages=[
              ("nlc-44091",27),
              ("nlc-44091",35),
              ("nlc-44091",87),
              ("nlc-44092",40),
          ]
          engine=OllamaLoopback("http://127.0.0.1:11434",model,timeout=900)
          result=run_batch(w,drafts,original_pages,engine,dpi=150,keep_going=True)
          catalog=json.loads(Path("src/knowledge/maiyi-source-checked-v5.json").read_text(encoding="utf-8"))
          pages=[]
          anchor_total=0
          hits=0
          for source,index in original_pages:
              txt,meta=draft_paths(drafts,source,index)
              valid=draft_valid(w,drafts,source,index,model) if txt.is_file() else False
              if valid:
                  content=txt.read_text(encoding="utf-8")
                  info=json.loads(meta.read_text(encoding="utf-8"))
                  anchors=reference_anchors(catalog,source).get(index,[])
                  probe=anchor_probe(content,anchors)
                  hits+=probe["exact_phrase_count"]
                  anchor_total+=probe["reference_phrase_count"]
                  pages.append({
                      "page_id":info["page_id"],
                      "model":info["model"],
                      "real_vision_draft_generated":True,
                      "page_type_predicted_unreviewed":info["page_type"],
                      "draft_han_characters":sum("\u3400"<=c<="\u9fff" for c in content),
                      "uncertain_span_count":len(info["uncertain_spans"]),
                      "figure_notes_count":len(info["figure_notes"]),
                      "draft_text_sha256":info["draft_text_sha256"],
                      "reference_short_fragment_probe":probe,
                      "human_reviewed":False,
                  })
              else:
                  pages.append({"page_id":f"{source}:p{index:03d}",
                                "real_vision_draft_generated":False,
                                "human_reviewed":False})
          manifest={
              "kind":"M16.7_REAL_CPU_QWEN_VISION_ORIGINAL_SCAN_EXPERIMENT",
              "real_local_vision_model_inference_executed":result["new_drafts_produced"]>0,
              "model":model,
              "original_scanned_pages_attempted":len(original_pages),
              "actual_drafts_produced":result["new_drafts_produced"],
              "errors":result["errors"],
              "original_book_scan_sha256":{s:x["pdf_sha256"] for s,x in w.sources.items()},
              "reference_short_fragments_compared":anchor_total,
              "real_vision_short_fragment_exact_hits":hits,
              "reference_probe_is_NOT_character_accuracy":True,
              "source_human_reviewed_pages":0,
              "cangjie_five_extractor_agents_executed":False,
              "rule_cards_activated":0,
              "OCR_text_and_page_images_uploaded":False,
              "page_metadata":pages
          }
          Path("m16-7-real-vision-metadata-only.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print("M16.7 REAL MODEL OUTPUT SUMMARY (NO original-book text exposed):")
          print(json.dumps({k:v for k,v in manifest.items() if k not in ("page_metadata","errors")},
                           ensure_ascii=False))
          print("Per-page verified generation:",[(x["page_id"],x["real_vision_draft_generated"])
                                                  for x in pages])
          if result["errors"]:
              print("NOTE: per-page model errors:",json.dumps(result["errors"],ensure_ascii=False))
          assert result["new_drafts_produced"]>=1, "Real Qwen model did not produce even one source-bound draft"
          assert any(p.get("draft_han_characters",0)>0 for p in pages), \
              "Real Qwen model generated no Han characters in sampled original text pages"
          assert w.summary()["full_page_reviewed"]==0, \
              "AI result must never auto-approve original text"
          PY

      - name: Upload ONLY provenance, aggregate page counts and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-7-real-qwen-vision-source-page-statistics-only
          path: m16-7-real-vision-metadata-only.json
          retention-days: 14
          if-no-files-found: warn
