name: M16.7 REAL Qwen3-VL compact ancient-page layout pilot

on:
  pull_request:
    paths:
      - ".github/workflows/cangjie-real-vlm-cpu.yml"
      - "scripts/cangjie_vision_layout.py"
      - "tests/test_cangjie_vision_layout.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-layout-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_cangjie_vision_layout.py' -v

  real-local-vision-layout:
    needs: compact-layout-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poppler for original scan-page rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download BOTH exact original 1925 scans to runner only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/faceface-originals"
          curl --fail --location --retry 3 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/a/a0/NLC416-12jh002690-44091_%E9%BA%BB%E8%A1%A3%E7%9B%B8%E6%B3%95_%E7%AC%AC1%E5%8D%B7.pdf" \
            -o "$RUNNER_TEMP/faceface-originals/part1.pdf"
          curl --fail --location --retry 3 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/5/5d/NLC416-12jh002690-44092_%E9%BA%BB%E8%A1%A3%E7%9B%B8%E6%B3%95_%E7%AC%AC2%E5%8D%B7.pdf" \
            -o "$RUNNER_TEMP/faceface-originals/part2.pdf"
          test -s "$RUNNER_TEMP/faceface-originals/part1.pdf"
          test -s "$RUNNER_TEMP/faceface-originals/part2.pdf"

      - name: Start REAL Ollama on free runner CPU
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh \
            -o "$RUNNER_TEMP/ollama-install.sh"
          sh "$RUNNER_TEMP/ollama-install.sh"
          ollama --version
          if ! curl --silent --fail "http://127.0.0.1:11434/api/tags" >/dev/null; then
            nohup ollama serve > "$RUNNER_TEMP/ollama-serve.log" 2>&1 &
          fi
          for i in $(seq 1 50); do
            curl --silent --fail "http://127.0.0.1:11434/api/tags" >/dev/null && break
            sleep 2
          done
          curl --fail --silent --show-error "http://127.0.0.1:11434/api/tags" >/dev/null

      - name: Pull REAL Qwen3-VL 2B image model
        shell: bash
        run: |
          ollama pull qwen3-vl:2b-instruct
          ollama list
          curl --fail --silent --show-error "http://127.0.0.1:11434/api/tags" \
            -o "$RUNNER_TEMP/ollama-model-tags.json"

      - name: REAL limited-JSON vision layout inference on 1925 pages
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.cangjie_review_core import ReviewWorkspace
          from scripts.cangjie_vision_agent_batch import OllamaLoopback
          from scripts.cangjie_vision_layout import classify_batch, layout_paths, valid_previous
          temp=Path(os.environ["RUNNER_TEMP"])
          model="qwen3-vl:2b-instruct"
          workspace=ReviewWorkspace(
              temp/"faceface-originals",temp/"private-ocr",
              temp/"private-reviewed",draft_dir=temp/"private-agent-drafts"
          )
          local_out=temp/"private-layouts"
          # Sample a text-heavy page, a known illustrative source page,
          # and a separate scanned fascicle. The AI labels are NOT truth.
          selected=[
              ("nlc-44091",27),
              ("nlc-44091",87),
              ("nlc-44092",40)
          ]
          real_engine=OllamaLoopback("http://127.0.0.1:11434",model,timeout=240)
          result=classify_batch(workspace,real_engine,selected,local_out,
                                dpi=120,keep_going=True)
          evidence=[]
          for sid,page in selected:
              if valid_previous(workspace,local_out,sid,page,model):
                  x=json.loads(layout_paths(local_out,sid,page).read_text("utf-8"))
                  evidence.append({
                      "page_id":x["page_id"],
                      "real_model_inference":True,
                      "page_type_AI_guess":x["layout"]["page_type"],
                      "has_illustration_AI_guess":x["layout"]["has_illustration"],
                      "vertical_text_AI_guess":x["layout"]["vertical_text"],
                      "column_count_AI_guess":x["layout"]["column_count_estimate"],
                      "needs_human_layout_check":x["layout"]["needs_human_layout_check"],
                      "rendered_source_image_sha256":x["original_rendered_page_sha256"],
                      "human_reviewed":False
                  })
              else:
                  evidence.append({"page_id":f"{sid}:p{page:03d}",
                                   "real_model_inference":False,"human_reviewed":False})
          records={
              "kind":"M16.7_REAL_CPU_VISION_PAGE_LAYOUT_FEASIBILITY",
              "actual_model_inference_attempted":True,
              "model":model,
              "original_pages_attempted":len(selected),
              "valid_real_model_layout_annotations":result["new_real_model_layout_annotations"],
              "invalid_or_failed_original_pages":result["errors"],
              "old_long_JSON_full_page_transcription_trial_valid_pages":"1/4",
              "reason_for_strategy_change":"full-page model JSON truncated in 3 of 4 real trials",
              "original_pdf_hashes":{sid:d["pdf_sha256"] for sid,d in workspace.sources.items()},
              "page_metadata":evidence,
              "full_page_original_human_reviewed":workspace.summary()["full_page_reviewed"],
              "book_full_page_transcription_created_by_this_job":False,
              "agent_cangjie_extraction_completed":False,
              "public_upload_contains_original_book_text":False
          }
          Path("m16-7-real-vision-layout-metadata.json").write_text(
              json.dumps(records,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print("REAL QWEN SHORT LAYOUT OUTPUTS:",[(p["page_id"],p["real_model_inference"]) for p in evidence])
          print("MODEL CLASSIFICATION STATISTICS:",json.dumps({
              k:v for k,v in records.items() if k not in ("page_metadata","invalid_or_failed_original_pages")
          },ensure_ascii=False))
          print("ORIGINAL-PAGE TRANSCRIPTION/REVIEW NOT CLAIMED; images and full text stay in runner.")
          assert result["new_real_model_layout_annotations"]>=2, \
              "Small CPU VLM still cannot reliably produce short layout JSON (need different engine)"
          assert workspace.summary()["full_page_reviewed"]==0
          PY

      - name: Upload metadata only, NEVER the original page images or OCR/transcript text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-7-real-qwen-short-layout-actual-inference-statistics
          path: m16-7-real-vision-layout-metadata.json
          if-no-files-found: warn
          retention-days: 14
