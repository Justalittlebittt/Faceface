name: M1 real-model browser smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/browser-model-smoke.mjs"
      - ".github/workflows/browser-model-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build actual website
        run: npm run build
      - name: Install mobile Chromium and WebKit (test dependencies only)
        run: |
          npm install --no-save playwright@1.65.0 --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Obtain official MediaPipe example portrait temporarily
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://storage.googleapis.com/mediapipe-assets/portrait.jpg \
            --output dist/ci-portrait.jpg
          test -s dist/ci-portrait.jpg
      - name: Real MediaPipe test in emulated Android Chromium
        run: FACEFACE_BROWSER=chromium node scripts/browser-model-smoke.mjs
      - name: Real MediaPipe test in Linux WebKit (Safari engine approximation)
        run: FACEFACE_BROWSER=webkit node scripts/browser-model-smoke.mjs
